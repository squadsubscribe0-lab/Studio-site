<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Astro War: Alien Invasion</title>

<style>
@font-face{font-family:'Lilita One';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/lilita-one-latin-ext-400-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Lilita One';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/lilita-one-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{--ink:#0b1020;--blue:#2fa8ff;--k:1}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;touch-action:none;overscroll-behavior:none;background:#05030d;font-family:'Lilita One',system-ui,sans-serif;color:#fff}
#game canvas{display:block;position:fixed;inset:0;touch-action:none}
#ui{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.btn{pointer-events:auto;cursor:pointer;transition:transform .12s}
.btn:active{transform:scale(.94)}
.stroke{text-shadow:0 2px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink),2px 2px 0 var(--ink),-2px 2px 0 var(--ink),2px -2px 0 var(--ink),-2px -2px 0 var(--ink),0 4px 0 var(--ink)}
.hidden{display:none!important}

/* coins */
.coin{display:inline-block;width:36px;height:36px;flex:none;background:url(assets/icons/coin.png) center/contain no-repeat}
.coin.sm{width:18px;height:18px;vertical-align:-4px}
.coin.fly{position:absolute;width:26px;height:26px;z-index:5;pointer-events:none}
#coinBox{position:absolute;top:14px;right:14px;display:flex;align-items:center}
#coinBox .val{background:linear-gradient(#3fb4ff,#1677d6);border:3px solid var(--ink);border-radius:10px;
  padding:2px 30px 2px 14px;margin-right:-26px;font-size:24px;min-width:96px;text-align:center}
#coinBox .coin{width:48px;height:48px;position:relative;z-index:1;filter:drop-shadow(0 2px 0 rgba(0,0,0,.35))}
#coinBox.bump .coin{animation:bump .18s}
@keyframes bump{50%{transform:scale(1.22)}}
#runGain{position:absolute;top:62px;right:28px;font-size:18px;color:#fff}

/* top-left */
#tl{position:absolute;top:14px;left:14px;display:flex;flex-direction:column;gap:14px;align-items:center}
#tl .ico{width:60px;height:60px;display:grid;place-items:center}
.icoimg{width:60px;height:60px;object-fit:contain;filter:drop-shadow(0 3px 0 rgba(0,0,0,.4))}
#tl .lbl{font-size:16px;margin-top:-4px}
#pauseBtn{width:50px;height:50px;border-radius:12px;background:linear-gradient(#5b6b8c,#323c56);border:3px solid var(--ink);display:grid;place-items:center}

/* level title */
#top{position:absolute;top:16px;left:50%;transform:translateX(-50%);text-align:center;width:min(60vw,360px)}
#levelTxt{font-size:34px;letter-spacing:1px}
.tier{display:inline-block;font-size:15px;padding:2px 8px;margin-left:6px;border-radius:8px;border:3px solid var(--ink);background:var(--tc);color:var(--ink);text-shadow:none;vertical-align:middle;letter-spacing:0}
#prog{margin:6px auto 0;height:16px;border:3px solid var(--ink);border-radius:10px;background:#1c2340;overflow:hidden;position:relative}
#progFill{height:100%;width:0;background:linear-gradient(90deg,#38e0ff,#7bff7a);border-radius:6px}
#hint{margin:10px auto 0;display:inline-flex;white-space:nowrap;align-items:center;gap:8px;background:rgba(20,26,48,.82);border-radius:12px;padding:8px 16px;font-size:20px;animation:pulse 1.4s ease-in-out infinite}
#hint .kimg{width:38px;height:38px;object-fit:contain;vertical-align:middle}
#hint .simg{width:40px;height:40px;object-fit:contain;vertical-align:middle}
#levelSub{font-size:15px;margin-top:2px;opacity:.95}
@keyframes pulse{50%{transform:scale(1.05)}}

/* cards */
#cards{position:absolute;bottom:16px;left:50%;display:flex;gap:16px;transform:translateX(-50%) scale(var(--k));transform-origin:bottom center}
.card{width:118px;border:3px solid var(--ink);border-radius:10px;background:var(--c2);position:relative;box-shadow:0 5px 0 var(--ink);padding:4px}
.card .badge{position:absolute;top:-14px;right:-14px;width:34px;height:34px;border-radius:50%;background:#8e98a8;border:3px solid #3c4452;display:grid;place-items:center;font-size:17px;z-index:2}
.card .ct{background:var(--c);border:2px solid var(--ink);border-radius:6px 6px 0 0;text-align:center;font-size:17px;padding:3px 0}
.card .ci{height:88px;background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.55),var(--c) 70%);border:2px solid var(--ink);border-top:0;position:relative;display:grid;place-items:center}
.card .ci img{width:76px;height:76px;object-fit:contain;filter:drop-shadow(0 3px 0 rgba(0,0,0,.3))}
.card .up{position:absolute;left:-14px;top:-16px;width:36px;height:36px;display:none;z-index:2;animation:bob .9s ease-in-out infinite}
.card.can .up{display:block}
@keyframes bob{50%{transform:translateY(-5px)}}
.card .cv{position:absolute;bottom:2px;left:0;right:0;text-align:center;font-size:15px}
.card .pips{display:flex;gap:3px;margin:5px 0}
.card .pips i{flex:1;height:10px;border-radius:3px;background:#c9ced8;border:2px solid var(--ink)}
.card .pips i.on{background:var(--c)}
.card .cb{background:var(--c);border:2px solid var(--ink);border-radius:0 0 6px 6px;text-align:center;padding:3px 0 4px;font-size:16px;line-height:1.15}
.card .cost{font-size:15px}
.card.poor{filter:saturate(.3) brightness(.75)}
.card .clv{text-align:center;font-size:13px;margin-top:4px}
.card.maxed{box-shadow:0 5px 0 var(--ink),0 0 0 3px #ffd21f}
.card.maxed .badge{background:#ffd21f;border-color:#a86a00;color:#0b1020;font-size:12px;text-shadow:none}
.card.maxed .pips i.on{background:#ffd21f}
.card.poor:active{transform:none}

/* right side */
#side{position:absolute;right:14px;top:32%;display:flex;flex-direction:column;gap:14px;align-items:flex-end;transform:scale(var(--k));transform-origin:right top}
#allyCard{width:92px;text-align:center}
#allyCard .box{height:84px;border:3px solid var(--ink);border-radius:10px;background:linear-gradient(#57c8ff,#1a7fe0);display:grid;place-items:center;position:relative;box-shadow:0 4px 0 var(--ink)}
#allyCard .box img{width:72px;height:72px;object-fit:contain}
#allyCard .box b{position:absolute;right:4px;bottom:0;font-size:22px}
#allyCard .sub{font-size:12px;margin-top:6px}
#allyCard.owned .box{background:linear-gradient(#7bff7a,#22a64a)}
#allyCard.poor{filter:saturate(.3) brightness(.75)}
#daily .gift{position:absolute;left:-30px;top:-22px;width:58px;height:58px;filter:drop-shadow(0 3px 0 rgba(0,0,0,.35))}
#daily{position:relative;width:196px;padding-left:30px!important;background:linear-gradient(#b48cff,#7e4fe0);border:3px solid var(--ink);border-radius:10px;padding:6px 10px;box-shadow:0 4px 0 var(--ink)}
#daily .t{font-size:15px}
#daily .row{display:flex;align-items:center;justify-content:space-between}
#daily .time{font-size:22px}
#daily .claim{margin-top:4px;text-align:center;background:#3fb4ff;border:2px solid var(--ink);border-radius:6px;font-size:16px}
#daily.ready .claim{background:#7bff7a;color:var(--ink);text-shadow:none;animation:pulse 1s infinite}

/* boss bar */
#boss{position:absolute;top:96px;left:50%;transform:translateX(-50%);width:min(78vw,440px);text-align:center}
#boss .n{font-size:20px;color:#ff9ac2}
#boss .bar{height:20px;border:3px solid var(--ink);border-radius:10px;background:#2a0a1a;overflow:hidden;margin-top:4px}
#boss .fill{height:100%;width:100%;background:linear-gradient(90deg,#ff2e7a,#ff8a3d);transform-origin:left center;transition:transform .1s}

/* fx */
#fx{position:absolute;inset:0;pointer-events:none}
.dmg{position:absolute;left:0;top:0;transform:translate(-50%,-50%);opacity:0;font-size:22px;color:#fff;white-space:nowrap}
.dmg.show{animation:dmgUp .7s ease-out forwards}
.dmg.crit{color:#ffe14a;font-size:26px}
.dmg.ally{color:#7bff7a}
@keyframes dmgUp{0%{opacity:1;transform:translate(-50%,-50%) scale(1.35)}20%{transform:translate(-50%,-70%) scale(1)}100%{opacity:0;transform:translate(-50%,-180%) scale(.85)}}
#banner{position:absolute;top:34%;left:50%;transform:translate(-50%,-50%);font-size:44px;opacity:0;white-space:nowrap;text-align:center}
#banner.show{animation:ban 1.5s ease-out forwards}
@keyframes ban{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}25%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%) scale(1)}}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#vignette{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 120px rgba(255,0,60,.0);transition:box-shadow .3s}
#vignette.danger{box-shadow:inset 0 0 140px rgba(255,0,60,.55)}

/* modals */
.modal{position:absolute;inset:0;background:rgba(3,4,14,.55);display:grid;place-items:center;pointer-events:auto}
.panel{background:linear-gradient(#8fdcff,#3d9df5);border:4px solid var(--ink);border-radius:16px;padding:18px 22px;min-width:240px;max-width:92vw;text-align:center;box-shadow:0 8px 0 var(--ink);animation:pop .3s ease-out}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
.panel h2{font-size:34px;margin-bottom:8px}
.panel .big{font-size:46px;display:flex;align-items:center;justify-content:center;gap:10px;margin:6px 0}
.panel .big .coin{width:44px;height:44px}
.panel .line{font-size:18px;margin:2px 0;opacity:.95}
.pbtn{display:block;margin:12px auto 0;min-width:150px;background:linear-gradient(#45e0ff,#14a6e0);border:3px solid var(--ink);border-radius:12px;padding:8px 20px;font-size:28px;box-shadow:0 5px 0 var(--ink);font-family:inherit;color:#fff}
.pbtn.green{background:linear-gradient(#8dff6a,#2fbf3f)}
.pbtn.red{background:linear-gradient(#ff7a8a,#e0244a)}
.pbtn.ad{background:linear-gradient(#c08cff,#7e4fe0)}
.pbtn.ad:disabled{filter:saturate(.3) brightness(.8)}
.pbtn.small{font-size:20px;min-width:120px;padding:6px 14px}
.panel.fail{background:linear-gradient(#ff9aa8,#d9364f)}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:24px;font-size:22px;margin:10px 0}
.sw{width:64px;height:32px;border-radius:16px;background:#3a4256;border:3px solid var(--ink);position:relative}
.sw::after{content:'';position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on{background:#2fbf3f}.sw.on::after{left:34px}
#shopGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}
.skin{background:rgba(10,20,50,.35);border:3px solid var(--ink);border-radius:10px;padding:8px 6px;width:104px}
.skin .sw2{width:46px;height:46px;border-radius:50%;margin:0 auto 4px;border:3px solid var(--ink);box-shadow:inset -6px -6px 0 rgba(0,0,0,.2)}
.skin .nm{font-size:13px}
.skin .pr{font-size:14px;margin-top:3px}
.skin.eq{background:rgba(123,255,122,.35)}
@media (max-width:520px){#shopGrid{grid-template-columns:repeat(2,1fr)}#levelTxt{font-size:26px}#hint{font-size:16px}.panel h2{font-size:28px}}
/* power-ups */
#powers{position:absolute;left:14px;top:80px;display:flex;flex-direction:column;gap:8px}
.pchip{position:relative;display:flex;align-items:center;gap:6px;background:rgba(11,16,32,.82);border:3px solid var(--c);border-radius:12px;padding:4px 12px 8px 6px;min-width:150px;overflow:hidden}
.pchip .pi{font-size:22px;line-height:1}
.pchip .pn{font-size:15px;color:var(--c)}
.pchip i{position:absolute;left:0;bottom:0;height:4px;background:var(--c)}
#frost{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .4s;background:radial-gradient(ellipse at center,rgba(160,230,255,0) 55%,rgba(170,235,255,.45))}
#frost.on{opacity:1}
/* touch buttons */
#touchBtns{position:absolute;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;padding:0 calc(16px + env(safe-area-inset-left)) 0 calc(16px + env(safe-area-inset-right))}
.tbtn{pointer-events:auto;width:104px;height:104px;display:grid;place-items:center;touch-action:none;transition:transform .08s,filter .08s;opacity:.9}
.tbtn img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 4px 0 rgba(0,0,0,.4))}
.tbtn.on{transform:scale(.9) translateY(3px);filter:brightness(1.15)}
/* score + leaderboard */
#scoreTxt{font-size:20px;margin-top:4px}
.panel.scroll{max-height:88vh;overflow-y:auto}
.lb{width:min(84vw,380px);border-collapse:collapse;margin:8px auto 4px;font-size:17px}
.lb td{padding:5px 6px;border-bottom:2px solid rgba(11,16,32,.25);text-align:left}
.lb td.r{text-align:right}
.lb tr.me td{background:rgba(255,225,74,.35)}
.lb .rk{width:34px;text-align:center}
.lb tr:nth-child(1) .rk{color:#ffe14a}.lb tr:nth-child(2) .rk{color:#e6eef8}.lb tr:nth-child(3) .rk{color:#ffb070}
.lb .lv{font-size:14px;opacity:.9}
.nameRow{display:flex;gap:8px;justify-content:center;align-items:center;margin:6px 0}
.nameRow input{font-family:inherit;font-size:18px;width:170px;padding:6px 10px;border:3px solid var(--ink);border-radius:10px;text-transform:uppercase;outline:none;color:var(--ink)}
.newhs{font-size:26px;color:#ffe14a;animation:pulse .8s infinite}
.seg{display:flex;border:3px solid var(--ink);border-radius:10px;overflow:hidden}
.seg div{padding:4px 10px;font-size:16px;background:#3a4256;cursor:pointer;pointer-events:auto}
.seg div.on{background:#2fbf3f}
.toggle input[type=range]{width:130px;accent-color:#2fbf3f;pointer-events:auto}
/* squad counter + result panels */
.squad{position:absolute;left:0;top:0;transform:translate(-50%,-100%);background:linear-gradient(#3f9bff,#1a5fd0);border:3px solid #fff;border-radius:14px;padding:0 12px;font-size:22px;min-width:44px;text-align:center;box-shadow:0 3px 0 var(--ink);pointer-events:none;will-change:transform}
.panel .hero{width:92px;height:92px;object-fit:contain;display:block;margin:-62px auto 2px;filter:drop-shadow(0 5px 0 rgba(0,0,0,.35))}
.res{width:min(78vw,330px);margin:6px auto 2px}
.res div{display:flex;justify-content:space-between;align-items:center;font-size:19px;padding:3px 2px;border-bottom:2px solid rgba(11,16,32,.18)}
.res div:last-child{border-bottom:0}
.res img{width:26px;height:26px;object-fit:contain;vertical-align:middle;margin-right:6px}
#loading{position:absolute;inset:0;display:grid;place-items:center;background:#05030d;font-size:30px;pointer-events:auto;z-index:20}
</style>

<body>
<div id="game"></div>
<div id="ui">
  <div id="fx"></div>
  <div id="vignette"></div>
  <div id="frost"></div>
  <div id="flash"></div>

  <div id="tl">
    <div id="settingsBtn" class="btn ico" title="Settings"><img class="icoimg" src="assets/icons/settings.png" alt="Settings"></div>
    <div id="shopBtn" class="btn" style="text-align:center">
      <div class="ico"><img class="icoimg" src="assets/icons/shop.png" alt=""></div>
      <div class="lbl stroke">SHOP</div>
    </div>
    <div id="rankBtn" class="btn" style="text-align:center">
      <div class="ico"><img class="icoimg" src="assets/icons/trophy.png" alt=""></div>
      <div class="lbl stroke">RANKS</div>
    </div>
    <div id="pauseBtn" class="btn hidden" title="Pause">
      <svg width="22" height="24" viewBox="0 0 22 24"><rect x="2" y="2" width="6" height="20" rx="2" fill="#fff"/><rect x="14" y="2" width="6" height="20" rx="2" fill="#fff"/></svg>
    </div>
  </div>

  <div id="powers" class="hidden"></div>

  <div id="coinBox"><div class="val stroke" id="coinVal">0</div><div class="coin" id="coinIcon"></div></div>

  <div id="top">
    <div id="levelTxt" class="stroke">LEVEL 1</div>
    <div id="levelSub" class="stroke"></div>
    <div id="prog" class="hidden"><div id="progFill"></div></div>
    <div id="scoreTxt" class="stroke hidden">SCORE 0</div>
    <div id="hint" class="stroke">PRESS <img class="kimg" src="assets/icons/key-left.png" alt=""><img class="kimg" src="assets/icons/key-right.png" alt=""> OR DRAG</div>
  </div>

  <div id="boss" class="hidden"><div class="n stroke" id="bossName">ALIEN OVERLORD</div><div class="bar"><div class="fill" id="bossFill"></div></div></div>

  <div id="cards"></div>

  <div id="side">
    <div id="allyCard" class="btn">
      <div class="box">
        <img src="assets/icons/ally.png" alt="">
        <b class="stroke">+1</b>
      </div>
      <div class="sub stroke" id="allyTxt">1 RUN ONLY · <span class="coin sm"></span> 100</div>
    </div>
    <div id="daily" class="btn">
      <img class="gift" src="assets/icons/gift.png" alt="">
      <div class="t stroke">DAILY REWARD</div>
      <div class="row"><span class="time stroke" id="dailyTime">00:00:00</span><span class="stroke" style="font-size:16px"><span class="coin sm"></span> +500</span></div>
      <div class="claim stroke" id="dailyClaim">CLAIM</div>

  <div id="squad" class="squad stroke hidden">1</div>

  <div id="touchBtns" class="hidden">

  </div>

  <div id="modal" class="modal hidden"><div class="panel" id="panel"></div></div>
  <div id="loading" class="stroke">LOADING...</div>
</div>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);
const randInt = (a, b) => Math.floor(rand(a, b + 1));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

/* ================= PLATFORM SDK =================
   Playgama Bridge picks the host platform at runtime (Playgama, Yandex, CrazyGames, Poki, ...).
   On YouTube Playables it drives the YouTube SDK: firstFrameReady/gameReady, cloud save,
   pause/resume, mute, ads and sendScore. Without any SDK the game falls back to localStorage. */
const PB = window.bridge || null;
const Platform = { ready: false, id: 'local', rewarded: false, interstitial: false, lbType: 'not_available', paused: false, audio: true, store: {} };
const STORE_KEYS = ['astroWar_v1', 'astroWar_lb'];
async function platformInit() {
  if (!PB) return;
  await PB.initialize();
  Platform.id = PB.platform.id;
  Platform.rewarded = !!PB.advertisement.isRewardedSupported;
  Platform.interstitial = !!PB.advertisement.isInterstitialSupported;
  try { Platform.lbType = PB.leaderboards.type; } catch (e) {}
  Platform.audio = PB.platform.isAudioEnabled !== false;
  Platform.paused = !!PB.platform.isPaused;
  // load before any save (YouTube requires loadData to finish before saveData)
  const vals = await PB.storage.get(STORE_KEYS, false);
  STORE_KEYS.forEach((k, i) => {
    const v = Array.isArray(vals) ? vals[i] : null;
    Platform.store[k] = v == null ? null : typeof v === 'string' ? v : JSON.stringify(v);
  });
  Platform.ready = true;
}
try { await Promise.race([platformInit(), new Promise((_, rej) => setTimeout(() => rej(new Error('bridge timeout')), 8000))]); }
catch (e) { console.warn('[platform] running without SDK:', e && e.message); }
const ON_PLATFORM = Platform.ready && Platform.id !== 'mock';
function storeGet(key) {
  if (Platform.ready) return Platform.store[key] ?? null;

let ac = null, master = null, noiseBuf = null;
function audio() {
  if (!ac) {

      ac = new (window.AudioContext || window.webkitAudioContext)();
      master = ac.createGain(); master.gain.value = 0.5; master.connect(ac.destination);
      noiseBuf = ac.createBuffer(1, ac.sampleRate * 0.5, ac.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { return null; }
  }

}

  const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(f1, 1), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(master); o.start(t); o.stop(t + dur + 0.02);
}

  const t = a.currentTime, s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  s.buffer = noiseBuf; f.type = 'lowpass'; f.frequency.setValueAtTime(freq, t); f.frequency.exponentialRampToValueAtTime(100, t + dur);

}

function updateObstacles(dt, live) {
  for (const o of obstacles) {
    o.t += dt * slowK();
    if (o.kind === 'saw') {
      o.x = Math.sin(o.t * o.speed + o.phase) * o.range;
      o.blade.rotation.z -= dt * 14 * slowK(); o.g.position.set(o.x, 0, o.z);
    } else {
      const ph = (o.t % o.period) / o.period;          // left half then right half
      for (let i = 0; i < 2; i++) {
        const local = (ph - i * 0.5 + 1) % 1 * 2;       // 0..2, active while < 1
        const warn = local < 0.22, on = local >= 0.22 && local < 1;
        o.live[i] = on; o.beams[i].material = on ? beamOn : warn ? (Math.floor(time * 16) % 2 ? beamWarn : beamOff) : beamOff;
      }
    }
    if (!live || Math.abs(player.z - o.z) > 4) continue;
    const hits = (x, z) => {
      if (Math.abs(z - o.z) > 0.38) return false;
      if (o.kind === 'saw') return Math.abs(x - o.x) < 0.95;
      return (o.live[0] && x < 0.15) || (o.live[1] && x > -0.15);
    };
    for (const al of [...allies]) if (hits(al.x, al.z)) killAlly(al);
    for (const a of aliens) if (!a.dead && hits(a.x, a.z)) killAlien(a, false);
    if (hits(player.x, player.z)) hurtPlayer();
  }
}

  }
  const pts = [], pyl = own(new THREE.BoxGeometry(0.8, 14, 0.8)), beam = own(new THREE.BoxGeometry(W + 2.4, 0.7, 0.9)), strip = own(new THREE.BoxGeometry(0.12, 12, 0.12)), beacon = own(new THREE.SphereGeometry(0.28, 12, 8));

      const st = new THREE.Mesh(strip, glowMat(T.rail, 2)); st.position.set(s * (W / 2 + 0.28), 6.5, z); levelGroup.add(st);
      const b = new THREE.Mesh(beacon, glowMat(0xff3355, 3)); b.position.set(s * (W / 2 + 0.7), 13.3, z); levelGroup.add(b);
      for (let k = 1; k <= 5; k++) for (const d of [-1, 1]) pts.push(s * (W / 2 + 0.7), 12.2, z, s * (W / 2 - 0.05), 1.25, z + d * k * 4.6);
    }

  const dg = own(new THREE.BufferGeometry()); dg.setAttribute('position', new THREE.BufferAttribute(dp, 3));
  dust = new THREE.Points(dg, own(new THREE.PointsMaterial({ color: T.dust, size: 0.12, transparent: true, opacity: 0.7, depthWrite: false })));

  boss = makeBoss(btype);
  boss.hp = boss.max = bossHpFor(L, boss, P.bossSpeed);
  boss.x = 0; boss.z = finishZ - 18; boss.speed = P.bossSpeed;

  showMenu(true); updateHUD();
}

/* ================= GATES (shootable: hits raise the number) ================= */
function rollGate(L, forceGood) {

  let val = kind === 'ally' ? pick([-3, -2, -1, 1, 1, 2]) : pick([-30, -20, -10, 10, 20]);

}

}

  const gr = g.createLinearGradient(0, 0, 0, h);
  if (good) { gr.addColorStop(0, 'rgba(70,190,255,.92)'); gr.addColorStop(1, 'rgba(20,80,200,.92)'); } else { gr.addColorStop(0, 'rgba(255,90,110,.92)'); gr.addColorStop(1, 'rgba(160,15,45,.92)'); }
  g.fillStyle = gr; g.beginPath(); g.roundRect(6, 6, w - 12, h - 12, 18); g.fill();
  g.strokeStyle = 'rgba(255,255,255,.9)'; g.lineWidth = 6; g.stroke();
  const [big, small] = gateText(it);
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.lineJoin = 'round';
  g.font = '68px "Lilita One", sans-serif'; g.lineWidth = 10; g.strokeStyle = '#0b1020'; g.strokeText(big, w / 2, 56); g.fillStyle = '#fff'; g.fillText(big, w / 2, 56);
  g.font = '30px "Lilita One", sans-serif'; g.lineWidth = 8; g.strokeText(small, w / 2, 106); g.fillText(small, w / 2, 106);
  // fill bar: shooting the gate fills it, a full bar raises the number
  const bx = 34, by = 130, bw = w - 68, bh = 18, maxed = it.val >= it.max;
  g.fillStyle = 'rgba(11,16,32,.75)'; g.beginPath(); g.roundRect(bx, by, bw, bh, 9); g.fill();
  g.fillStyle = maxed ? '#ffe14a' : '#ffffff';
  const f = maxed ? 1 : it.hits / it.hitsPer;
  if (f > 0) { g.beginPath(); g.roundRect(bx + 3, by + 3, Math.max(12, (bw - 6) * f), bh - 6, 6); g.fill(); }
  if (maxed) { g.font = '16px "Lilita One", sans-serif'; g.fillStyle = '#0b1020'; g.fillText('MAX', w / 2, by + bh / 2 + 1); }
  it.tex.needsUpdate = true;
  const pm = glowMat(good ? 0x3fc8ff : 0xff3a5a, 2.4); it.posts.forEach(p => p.material = pm);
}
function buildGatePair(z, first) {
  const L = save.level, a = rollGate(L, first ? 'ally' : true), b = rollGate(L, first);
  const opts = Math.random() < 0.5 ? [a, b] : [b, a];
  const pair = { z, used: false, items: [] };
  opts.forEach((it, i) => {
    it.x = i === 0 ? -2.5 : 2.5;
    const c = document.createElement('canvas'); c.width = 256; c.height = 168; it.ctx = c.getContext('2d');
    it.tex = own(new THREE.CanvasTexture(c)); it.tex.colorSpace = THREE.SRGBColorSpace;
    it.grp = new THREE.Group(); it.grp.position.set(it.x, 0, z); levelGroup.add(it.grp);
    it.mat = own(new THREE.MeshBasicMaterial({ map: it.tex, transparent: true, opacity: 0.92, side: THREE.DoubleSide, depthWrite: false }));
    const panel = new THREE.Mesh(own(new THREE.PlaneGeometry(4.3, 2.82)), it.mat); panel.position.y = 2.05; it.grp.add(panel);
    const postGeo = own(new THREE.BoxGeometry(0.18, 3.7, 0.18)); it.posts = [];

  ring2.rotation.y = Math.PI / 2; holder.add(ring, ring2);
  const icon = new THREE.Sprite(M.icon); icon.scale.set(0.85, 0.85, 1); holder.add(icon);
  holder.add(glowSprite(P.color, 2.6, 0.9));
  g.add(blob(1));
  pickups.push({ k, x, z, g, holder, ring, ring2, t: rand(0, 6), taken: false });
}
function addFxRing(x, z, color, max) {
  const m = new THREE.Mesh(new THREE.RingGeometry(0.8, 1, 48).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: new THREE.Color(color).multiplyScalar(2), transparent: true, depthWrite: false, side: THREE.DoubleSide }));
  m.position.set(x, 0.15, z); scene.add(m); fxRings.push({ mesh: m, t: 0, max });
}
function nuke() {
  flash(0.85); shake = 0.7; SFX.big(); addFxRing(player.x, player.z - 4, 0xff3d5a, 40);
  aliens.forEach(a => { if (a.z > player.z - 70) killAlien(a, true); });
  eshots.forEach(s => killShot(s));
  if (state === 'boss' && boss && !boss.dead) {
    const d = Math.round(boss.max * 0.15); boss.hp -= d; popText(boss.x, 4, boss.z, '-' + d, 'crit');
    $('bossFill').style.transform = `scaleX(${Math.max(0, boss.hp / boss.max)})`; if (boss.hp <= 0) killBoss();
  }
}
function applyPower(k, x, z) {
  const P = POWERS[k];
  SFX.power(); buzz(30); addScore(25 * save.level); updateHUD(); banner(P.icon + ' ' + P.name + '!', P.css); burst(x, 1.2, z, P.color, 14, 0.8);
  if (k === 'shield') run.shield = true;
  else if (k === 'nuke') nuke();
  else { run.pw[k] = P.dur; if (k === 'freeze') addFxRing(player.x, player.z, 0x9ff6ff, 25); }
}
const chipEls = {};
function renderPowers() {
  const box = $('powers'), active = Object.keys(POWERS).filter(k => k === 'shield' ? run.shield : run.pw[k] > 0);
  for (const k of Object.keys(chipEls)) if (!active.includes(k)) { chipEls[k].remove(); delete chipEls[k]; }
  for (const k of active) {
    if (!chipEls[k]) {
      const el = document.createElement('div'); el.className = 'pchip'; el.style.setProperty('--c', POWERS[k].css);
      el.innerHTML = `<span class="pi">${POWERS[k].icon}</span><span class="pn stroke">${POWERS[k].name}</span><i></i>`;
      box.appendChild(el); chipEls[k] = el;
    }
    chipEls[k].querySelector('i').style.width = (k === 'shield' ? 100 : run.pw[k] / POWERS[k].dur * 100) + '%';
  }
}
function updatePowers(dt, live) {
  for (const p of pickups) {
    if (p.taken) continue;
    p.t += dt; p.holder.position.y = 1.2 + Math.sin(p.t * 3) * 0.15; p.ring.rotation.x += dt * 2; p.ring2.rotation.z += dt * 2.5;
    if (!live) continue;
    if ([player, ...allies].some(s => Math.abs(s.z - p.z) < 1.0 && Math.abs(s.x - p.x) < 1.1)) { p.taken = true; levelGroup.remove(p.g); applyPower(p.k, p.x, p.z); }
    else if (p.z > player.z + 6) { p.taken = true; levelGroup.remove(p.g); }
  }
  if (pickups.some(p => p.taken)) pickups = pickups.filter(p => !p.taken);
  if (live) { for (const k in run.pw) if (run.pw[k] > 0) run.pw[k] = Math.max(0, run.pw[k] - dt); if (player.invuln > 0) player.invuln -= dt; }
  for (const r of fxRings) { r.t += dt; const f = r.t / 0.7; r.mesh.scale.setScalar(1 + f * r.max); r.mesh.material.opacity = Math.max(0, 1 - f); }
  if (fxRings.some(r => r.t > 0.7)) fxRings = fxRings.filter(r => { if (r.t > 0.7) { scene.remove(r.mesh); r.mesh.geometry.dispose(); r.mesh.material.dispose(); return false; } return true; });
  shieldBubble.visible = run.shield || (player.invuln > 0 && Math.floor(time * 12) % 2 === 0);
  shieldBubble.scale.setScalar(1 + Math.sin(time * 6) * 0.03);
  $('frost').classList.toggle('on', live && run.pw.freeze > 0);
  if (live) renderPowers();
}

/* ================= INPUT ================= */
const keys = { left: false, right: false };
addEventListener('keydown', e => {
  if (e.repeat) return;
  if (['ArrowLeft', 'a', 'A'].includes(e.key)) { keys.left = true; startRun(); }
  if (['ArrowRight', 'd', 'D'].includes(e.key)) { keys.right = true; startRun(); }
  if (e.key === 'Escape') {
    const closer = ['closeSet', 'closeShop', 'closeLb'].map(id => $(id)).find(Boolean);
    if (closer && !$('modal').classList.contains('hidden')) closer.click();
    else if (state === 'play' || state === 'boss') openSettings();
  }
});
addEventListener('keyup', e => {
  if (['ArrowLeft', 'a', 'A'].includes(e.key)) keys.left = false;
  if (['ArrowRight', 'd', 'D'].includes(e.key)) keys.right = false;
});
let dragging = false, lastX = 0;
const cv = renderer.domElement;
cv.addEventListener('pointerdown', e => { dragging = true; lastX = e.clientX; cv.setPointerCapture(e.pointerId); startRun(); });
cv.addEventListener('pointermove', e => {
  if (!dragging) return;
  if (state === 'play' || state === 'boss') player.tx = clamp(player.tx + (e.clientX - lastX) / Math.min(innerWidth, 900) * 15 * save.sens, -LIM, LIM);
  lastX = e.clientX;
});
const endDrag = () => dragging = false;
cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);
addEventListener('blur', () => { keys.left = keys.right = false; dragging = false; });
// on-screen buttons (touch)
for (const [id, k] of [['tbL', 'left'], ['tbR', 'right']]) {
  const el = $(id);
  const on = e => { e.preventDefault(); keys[k] = true; el.classList.add('on'); try { el.setPointerCapture(e.pointerId); } catch (err) {} };
  const off = () => { keys[k] = false; el.classList.remove('on'); };
  el.addEventListener('pointerdown', on);
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => el.addEventListener(ev, off));
  el.addEventListener('contextmenu', e => e.preventDefault());
}
// stop pinch-zoom / double-tap zoom / long-press menus on mobile
['gesturestart', 'gesturechange', 'dblclick'].forEach(ev => document.addEventListener(ev, e => e.preventDefault(), { passive: false }));
document.addEventListener('contextmenu', e => { if (e.target === cv) e.preventDefault(); });
// auto-pause when the app goes to the background
document.addEventListener('visibilitychange', () => { if (document.hidden && (state === 'play' || state === 'boss') && !paused) openSettings(); });

/* ================= CAMERA ================= */
const camPos = new THREE.Vector3(), camLook = new THREE.Vector3(), lookNow = new THREE.Vector3();
function camTarget() {
  camPos.set(player.x * 0.55, 6.8, player.z + 9.2);
  camLook.set(player.x * 0.35, 0.2, player.z - 7);
}
function snapCamera() { camTarget(); camera.position.copy(camPos); camera.lookAt(camLook); lookNow.copy(camLook); }

/* ================= LOOP ================= */
const clock = new THREE.Clock();
let time = 0;
function animRun(m, t, running) {
  if (running) {
    const s = Math.sin(t * 13);
    m.legs[0].rotation.x = s * 0.8; m.legs[1].rotation.x = -s * 0.8;
    m.inner.position.y = Math.abs(Math.cos(t * 13)) * 0.08;
    m.inner.rotation.y = s * 0.04;
  } else { m.legs.forEach(l => l.rotation.x *= 0.85); m.inner.rotation.y *= 0.9; }
}
function shoot(sh, x, z, m, dmg) {
  const s = m.scale;
  const bx = x + MUZZLE.x * s, by = MUZZLE.y * s + 0.02, bz = z + MUZZLE.z * s;
  const ally = sh !== player;
  spawnBullet(bx, by, bz, dmg, 0, ally);
  if (run.pw.triple > 0) { spawnBullet(bx, by, bz, dmg, -5, ally); spawnBullet(bx, by, bz, dmg, 5, ally); }
  sh.flashT = 0.05; m.flash.visible = true; m.flash.material.rotation = Math.random() * 6;
}
function update(dt) {
  time += dt;
  const live = state === 'play' || state === 'boss';

  // ---- player
  if (live) {
    if (keys.left) player.tx -= 11 * dt;
    if (keys.right) player.tx += 11 * dt;
    player.tx = clamp(player.tx, -LIM, LIM);
    player.x += (player.tx - player.x) * Math.min(1, dt * 12);
    if (state === 'play') { player.z -= RUN_SPEED * dt; if (player.z <= finishZ) { player.z = finishZ; enterBoss(); } }
    $('progFill').style.width = (clamp(player.z / finishZ, 0, 1) * 100) + '%';
  }
  const pm = player.model;
  player.t += dt;
  if (state === 'win') { pm.inner.position.y = Math.abs(Math.sin(player.t * 7)) * 0.6; pm.g.rotation.y += dt * 6; animRun(pm, player.t, false); }
  else if (state === 'lose') pm.g.rotation.x = Math.min(pm.g.rotation.x + dt * 5, Math.PI / 2.1);
  else { animRun(pm, player.t, state === 'play'); if (state !== 'play') pm.inner.position.y = Math.sin(player.t * 2.5) * 0.03; }
  pm.g.position.set(player.x, 0, player.z);
  if (live) pm.g.rotation.z = (player.tx - player.x) * -0.06;

  // ---- allies
  for (const al of allies) {
    const tx = clamp(player.x + al.off[0], -4.6, 4.6), tz = player.z + al.off[1];
    al.x += (tx - al.x) * Math.min(1, dt * 8); al.z += (tz - al.z) * Math.min(1, dt * 6);
    al.t += dt; const m = al.model;
    animRun(m, al.t, state === 'play');
    if (state === 'win') { m.inner.position.y = Math.abs(Math.sin(al.t * 7)) * 0.5; m.g.rotation.y += dt * 5; }
    m.g.position.set(al.x, 0, al.z);
  }

  // ---- shooting
  for (const sh of [player, ...allies]) { if (sh.flashT > 0) { sh.flashT -= dt; if (sh.flashT <= 0) (sh.model).flash.visible = false; } }
  if (live) {
    const rate = fireRate(), dmg = damage();
    player.cd -= dt;
    if (player.cd <= 0) { player.cd += 1 / rate; shoot(player, player.x, player.z, pm, dmg); SFX.shoot(); }
    for (const al of allies) { al.cd -= dt; if (al.cd <= 0) { al.cd += 1 / rate; shoot(al, al.x, al.z, al.model, dmg); } }
  }

  // ---- bullets
  for (const b of bullets) {
    b.prevZ = b.z; b.z -= BULLET_SPEED * dt; b.x += b.vx * dt; b.life -= dt; b.mesh.position.z = b.z; b.mesh.position.x = b.x;
    if (b.life <= 0) continue;
    for (const a of aliens) {
      if (a.dead) continue;
      if (a.z - a.r < b.prevZ && a.z + a.r > b.z && Math.abs(a.x - b.x) < a.r + 0.15) { hitAlien(a, b.dmg); b.life = 0; break; }
    }
    if (b.life <= 0) continue;
    for (const s of eshots) {
      if (s.dead) continue;
      if (s.z - s.r < b.prevZ && s.z + s.r > b.z && Math.abs(s.x - b.x) < s.r + 0.1) { b.life = 0; if (--s.hp <= 0) { killShot(s); SFX.boom(); } else burst(s.x, s.y, s.z, s.color, 2, 0.4); break; }
    }
    if (b.life <= 0) continue;
    for (const pair of gates) {
      if (pair.used || pair.z > b.prevZ || pair.z <= b.z) continue;
      for (const it of pair.items) if (Math.abs(b.x - it.x) < 2.15) { hitGate(it, pair.z); b.life = 0; break; }
      if (b.life <= 0) break;
    }
    if (b.life <= 0) continue;
    if (state === 'boss' && boss && !boss.dead && boss.z - boss.depth < b.prevZ && boss.z + boss.depth > b.z && Math.abs(boss.x - b.x) < boss.r) { hitAlien(boss, b.ally ? Math.max(1, Math.round(b.dmg * Math.min(ALLY_BOSS_DMG, 0.45 / Math.max(1, allies.length)))) : b.dmg); b.life = 0; }
  }
  for (let i = bullets.length - 1; i >= 0; i--) if (bullets[i].life <= 0) { const b = bullets[i]; b.mesh.visible = false; bulletFree.push(b); bullets.splice(i, 1); }

  // ---- aliens
  let danger = false;
  for (const a of aliens) {
    if (a.dead) continue;
    a.t += dt;
    if (a.flash > 0) { a.flash -= dt; if (a.flash <= 0) setFlash(a, false); }
    const near = a.z > player.z - 58;
    if (live && near) {
      a.z += a.speed * dt * slowK();
      const dz = player.z - a.z;
      if (dz < 11 && dz > -1) { const dx = player.x - a.x; a.x += clamp(dx, -a.steer * dt, a.steer * dt); }
      if (dz < 6) danger = true;
      const k = a.type === 'runner' ? 15 : 10, s = Math.sin(a.t * k);
      a.legs[0].rotation.x = s * 0.7; a.legs[1].rotation.x = -s * 0.7;
      a.arms[0].rotation.x = -1.15 + s * 0.25; a.arms[1].rotation.x = -1.15 - s * 0.25;
      a.inner.position.y = Math.abs(Math.cos(a.t * k)) * 0.08; a.inner.rotation.z = s * 0.08;
    } else {
      a.inner.position.y = Math.sin(a.t * 3) * 0.05; a.inner.rotation.y = Math.sin(a.t * 1.3) * 0.3;
    }
    a.g.position.x = a.x; a.g.position.z = a.z;
    a.g.visible = a.z > player.z - 110;   // far-away aliens are hidden in the fog anyway
    if (!live) continue;
    for (const al of allies) {
      if (Math.abs(al.z - a.z) < a.r + 0.2 && Math.abs(al.x - a.x) < a.r * 0.7 + 0.2) { killAlly(al); killAlien(a, false); break; }
    }
    if (a.dead) continue;
    if (Math.abs(player.z - a.z) < a.r + 0.2 && Math.abs(player.x - a.x) < a.r * 0.7 + 0.2) {
      const saved = run.shield || player.invuln > 0; hurtPlayer(); if (saved) { killAlien(a, true); continue; }
    }
    if (a.z > player.z + 6) { a.dead = true; levelGroup.remove(a.g); disposeEnemy(a); }
  }
  if (aliens.some(a => a.dead)) aliens = aliens.filter(a => !a.dead);

  // ---- boss + enemy shots
  if (updateBoss(dt)) danger = true;
  for (const s of eshots) {
    if (s.dead) continue;
    if (live) { s.x += s.vx * dt * slowK(); s.z += s.vz * dt * slowK(); s.y += (1.1 - s.y) * Math.min(1, dt * 2.5); }
    s.mesh.position.set(s.x, s.y, s.z); s.mesh.rotation.y += dt * 4;
    if (!live) continue;
    if (player.z - s.z < 5) danger = true;
    for (const al of allies) if (Math.abs(al.z - s.z) < s.r + 0.3 && Math.abs(al.x - s.x) < s.r + 0.25) { killAlly(al); killShot(s); break; }
    if (s.dead) continue;
    if (Math.abs(player.z - s.z) < s.r + 0.25 && Math.abs(player.x - s.x) < s.r + 0.15) { killShot(s); hurtPlayer(); }
    if (s.z > player.z + 8 || Math.abs(s.x) > 8) killShot(s, false);
  }
  if (eshots.some(s => s.dead)) eshots = eshots.filter(s => !s.dead);
  $('vignette').classList.toggle('danger', live && danger);

  // ---- gates
  for (const pair of gates) {
    for (const it of pair.items) {
      if (it.dirty) { it.dirty = false; drawGate(it); }
      if (it.pulse > 0 && !pair.used) { it.pulse -= dt; it.grp.scale.setScalar(1 + Math.max(0, it.pulse) * 0.5); }
    }
    if (!pair.used && live && player.z <= pair.z) {
      pair.used = true;
      const it = pair.items[player.x < 0 ? 0 : 1], v = it.val;
      if (it.kind === 'ally') { if (v > 0) addAllies(v); else for (let i = 0; i < -v; i++) if (allies.length) killAlly(allies[allies.length - 1]); }
      else if (it.kind === 'fr') run.frMul *= 1 + v / 100; else run.dmgMul *= 1 + v / 100;
      const [big, small] = gateText(it);
      banner(`${big} ${small}`, v > 0 ? '#9ff6ff' : '#ff8a9a');
      v > 0 ? SFX.gate() : SFX.bad(); buzz(v > 0 ? 25 : 90); if (v > 0) { addScore(50 * save.level); updateHUD(); }
      burst(it.x, 2, pair.z, v > 0 ? 0x3fc8ff : 0xff3a5a, 18, 1.2);
      pair.items.forEach(o => o.fade = 1); it.pop = true;
    }
    if (pair.used) for (const it of pair.items) {
      if (it.fade > 0) { it.fade -= dt * 2.5; it.mat.opacity = Math.max(0, it.fade) * 0.92; if (it.pop) it.grp.scale.setScalar(1 + (1 - it.fade) * 0.4); if (it.fade <= 0) it.grp.visible = false; }
    }
  }

  // ---- obstacles
  updateObstacles(dt, live);

  // ---- squad counter above the astronaut
  const sq = $('squad');
  if (state === 'loading' || state === 'lose' || paused) sq.classList.add('hidden');
  else {
    const p = toScreen(player.x, 2.55, player.z);
    if (p) { sq.classList.remove('hidden'); sq.style.transform = `translate(${p[0]}px,${p[1]}px) translate(-50%,-100%)`; const n = String(1 + allies.length); if (sq.textContent !== n) sq.textContent = n; }
  }

  // ---- power-ups
  updatePowers(dt, live);

  // ---- particles
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.life -= dt;
    if (p.life <= 0) { p.mesh.visible = false; partFree.push(p); parts.splice(i, 1); continue; }
    p.vy -= 14 * dt; p.mesh.position.x += p.vx * dt; p.mesh.position.y = Math.max(0.08, p.mesh.position.y + p.vy * dt); p.mesh.position.z += p.vz * dt;
    p.mesh.rotation.x += dt * 6; p.mesh.scale.setScalar(p.s * (p.life / p.max));
  }

  // ---- world fx
  if (portal) {
    const u = portal.userData;
    u.swirl.rotation.z -= dt * 1.6; u.swirl2.rotation.z += dt * 2.4; u.chev.rotation.z += dt * 0.25;
    u.light.intensity = 40 + Math.sin(time * 4) * 10;
  }
  for (const r of asteroids) { r.rotation.x += r.userData.r.x * dt; r.rotation.y += r.userData.r.y * dt; }
  ring.rotation.z += dt * 0.01; gas.rotation.y += dt * 0.005;

  // ---- camera
  camTarget();
  if (state === 'boss') { camPos.y += 1.6; camPos.z += 3; }
  if (state === 'win') { camPos.x += Math.sin(time * 0.6) * 3; camPos.y -= 1.5; camPos.z -= 2; camLook.set(player.x, 1.2, player.z); }
  const k = Math.min(1, dt * 4);
  camera.position.lerp(camPos, k); lookNow.lerp(camLook, k);
  if (shake > 0) { shake -= dt; camera.position.x += rand(-1, 1) * shake * 0.6; camera.position.y += rand(-1, 1) * shake * 0.6; }
  camera.lookAt(lookNow);
  sky.position.copy(camera.position);
  sun.position.set(camera.position.x + 30, 40, camera.position.z + 20); sun.target.position.set(camera.position.x, 0, camera.position.z);
  sun.target.updateMatrixWorld();
}

let looping = true;
function frame() {
  if (sysPaused) { looping = false; return; }       // host asked us to stop: no updates, no rendering
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.05);
  if (!paused && state !== 'loading') update(dt);
  if (!innerWidth || !innerHeight) return;           // hidden iframe with no size yet
  if (save.glow) composer.render(); else renderer.render(scene, camera);
}







function applyAudio() {
  const on = Platform.audio && !sysPaused;
  if (!on) { Music.stop(); if (ac && ac.state === 'running') ac.suspend().catch(() => {}); }
  else { if (ac && ac.state === 'suspended') ac.resume().catch(() => {}); if (save.music) Music.start(); }
}
function setSystemPause(p) {
  if (p === sysPaused) return;
  sysPaused = p;
  if (p) { flushStore(); keys.left = keys.right = false; dragging = false; }
  applyAudio();
  if (!p && !looping) { looping = true; clock.getDelta(); requestAnimationFrame(frame); }
}
if (Platform.ready) {
  PB.platform.on(PB.EVENT_NAME.AUDIO_STATE_CHANGED, v => { Platform.audio = typeof v === 'boolean' ? v : PB.platform.isAudioEnabled !== false; applyAudio(); });
  PB.platform.on(PB.EVENT_NAME.PAUSE_STATE_CHANGED, v => setSystemPause(typeof v === 'boolean' ? v : !!PB.platform.isPaused));
}
addEventListener('pagehide', flushStore);

/* ================= RESIZE ================= */
function onResize() {
  camera.aspect = innerWidth / innerHeight;
  camera.fov = innerWidth < innerHeight ? 72 : 58;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight); bloom.setSize(innerWidth, innerHeight);
  document.documentElement.style.setProperty('--k', Math.min(1, innerWidth / 470, innerHeight / 640).toFixed(3));
}
addEventListener('resize', onResize);

/* ================= BOOT ================= */
onResize();
const fontReady = document.fonts ? Promise.race([document.fonts.load('40px "Lilita One"'), new Promise(r => setTimeout(r, 2500))]) : Promise.resolve();
fontReady.catch(() => {}).finally(() => {
  buildLevel();
  $('loading').remove();
  frame();
  platformMessage('game_ready');                    // YouTube: gameReady() — only now is the game interactive
  if (Platform.paused) setSystemPause(true);
  if (leaderboard.length) submitBestScore(leaderboard[0].score);
});
</script>
