<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- assets.js fetches its manifests with document-relative paths
     ("assets/characters/manifest.json"), which from /tools/ resolve to
     /tools/assets/... and 404 into the built-in fallback roster. Rebase the
     document; the imports below are absolute to match. -->
<base href="/" />
<title>Beach Volley Clash — cover renderer</title>
<style>
  body{font:14px/1.55 ui-monospace,Menlo,Consolas,monospace;background:#0f1626;color:#e8edf5;margin:0;padding:24px}
  h1{font-size:16px;margin:0 0 4px}
  p{color:#94a3b8;max-width:70ch;margin:0 0 16px}
  .row{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start;margin-top:18px}
  figure{margin:0}
  figcaption{color:#94a3b8;margin-top:6px;font-size:12px}
  canvas{background:#0a1424;border:1px solid #223;border-radius:6px;display:block}
  #log{margin-top:16px;white-space:pre-wrap;color:#7dd3a0}
  .err{color:#ff8f8f}
</style>
</head>
<body>
<h1>Cover renderer</h1>
<p>
  Composes the three store covers as key art and writes them to
  <code>store-assets/</code> through the dev server. Nothing here ships —
  <code>tools/</code> is not in build.py's INCLUDE_DIRS.
</p>
<div class="row" id="out"></div>
<div id="log"></div>

<script type="module">
import { VIEW } from '/src/config.js';
import { loadAllAssets } from '/src/core/assets.js';
import { attachPowerIcons } from '/src/game/powers.js';
import { Renderer } from '/src/game/renderer.js';

const log = (msg, bad) => {
  const el = document.getElementById('log');
  el.innerHTML += `<span class="${bad ? 'err' : ''}">${msg}</span>\n`;
};

// The previous covers were a tight crop of a posed rally with the title laid
// over it - CrazyGames' cover guide asks for exactly the opposite ("Don't just
// take a screenshot of the game ... use the main character as the primary
// visual element"). These are composed instead: the beach is only a blurred
// backdrop, and the hero is drawn far larger than any gameplay frame, by the
// game's own body painter so the art is still the game's art.
//
// Every layout number is a fraction of the output, so the three shapes are
// the same picture reframed rather than three different pictures.
// `hero.s` is the body's scale as a fraction of the output height; the ball
// hangs off the hand in body units, so it follows the hero everywhere.
const SIZES = [
  { name: 'cover-landscape.png', w: 1920, h: 1080,
    bg:    { cx: 760, cy: 470, worldW: 1040 },
    hero:  { x: 0.755, y: 0.985, s: 0.00440 },
    burst: { x: 0.60, y: 0.30 },
    title: { x: 0.265, y: 0.44, unit: 1 / 18.5, rot: -0.07 } },
  { name: 'cover-portrait.png', w: 800, h: 1200,
    bg:    { cx: 820, cy: 470, worldW: 520 },
    hero:  { x: 0.62, y: 1.05, s: 0.00360 },
    burst: { x: 0.30, y: 0.47 },
    title: { x: 0.5, y: 0.15, unit: 1 / 10.7, rot: -0.07 } },
  { name: 'cover-square.png', w: 800, h: 800,
    bg:    { cx: 800, cy: 480, worldW: 760 },
    hero:  { x: 0.62, y: 1.085, s: 0.00340 },
    burst: { x: 0.36, y: 0.50 },
    title: { x: 0.5, y: 0.17, unit: 1 / 14, rot: -0.07 } }
];

// Canvas text has no web font to fall back on here - the game bundles none -
// so name the heaviest face Windows ships. The extrusion, gradient and tilt
// below are what make it read as a logo rather than a caption.
const LOGO_FONT = '"Segoe UI Black","Arial Black","Segoe UI",system-ui,sans-serif';

const LINE = '#05080f';

/** A pose object with just the fields drawVectorBody and head() read. */
const SPIKE_POSE = { onGround: false, spikeHeld: true, diveTimer: 0, frozen: 0, burning: 0 };

// --------------------------------------------------------------- layers

/** The beach, rendered once at 3x and blurred into a backdrop. */
function backdrop(ctx, scene, spec) {
  const { w, h, bg } = spec;
  const SS = scene.width / VIEW.W;
  const worldH = bg.worldW * (h / w);
  const sx = (bg.cx - bg.worldW / 2) * SS;
  const sy = (bg.cy - worldH / 2) * SS;
  ctx.save();
  ctx.filter = `blur(${Math.round(w * 0.0055)}px) saturate(1.12)`;
  // Overdraw by a few percent so the blur has pixels to pull in at the edges
  // instead of fading to transparent.
  const pad = w * 0.03;
  ctx.drawImage(scene, sx, sy, bg.worldW * SS, worldH * SS, -pad, -pad * (h / w), w + pad * 2, h + pad * 2 * (h / w));
  ctx.restore();

  // Cool the sky, warm the sand: pushes the backdrop back and makes room for
  // a warm hero and a hot ball to come forward.
  const grade = ctx.createLinearGradient(0, 0, 0, h);
  grade.addColorStop(0, 'rgba(12,48,120,0.28)');
  grade.addColorStop(0.55, 'rgba(12,48,120,0.04)');
  grade.addColorStop(1, 'rgba(90,40,0,0.10)');
  ctx.fillStyle = grade;
  ctx.fillRect(0, 0, w, h);
}

/** Rays and a glow behind the hero - the "big moment" light. */
function sunburst(ctx, spec) {
  const { w, h } = spec;
  const cx = spec.burst.x * w, cy = spec.burst.y * h;
  const R = Math.hypot(w, h);

  const layer = document.createElement('canvas');
  layer.width = w; layer.height = h;
  const l = layer.getContext('2d');
  const RAYS = 18;
  l.fillStyle = 'rgba(255,246,214,0.30)';
  for (let i = 0; i < RAYS; i++) {
    const a0 = (i / RAYS) * Math.PI * 2 - 0.2;
    const a1 = a0 + (Math.PI * 2 / RAYS) * 0.48;
    l.beginPath();
    l.moveTo(cx, cy);
    l.arc(cx, cy, R, a0, a1);
    l.closePath();
    l.fill();
  }
  // Fade the rays out with distance, so they read as light, not stripes.
  l.globalCompositeOperation = 'destination-in';
  const fade = l.createRadialGradient(cx, cy, 0, cx, cy, R * 0.52);
  fade.addColorStop(0, 'rgba(0,0,0,1)');
  fade.addColorStop(1, 'rgba(0,0,0,0)');
  l.fillStyle = fade;
  l.fillRect(0, 0, w, h);
  ctx.drawImage(layer, 0, 0);

  const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.min(w, h) * 0.55);
  glow.addColorStop(0, 'rgba(255,238,178,0.62)');
  glow.addColorStop(0.45, 'rgba(255,214,120,0.20)');
  glow.addColorStop(1, 'rgba(255,214,120,0)');
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, w, h);
}

/**
 * The hero mid-spike, facing the title, with the fireball leaving the hand.
 * Drawn to its own layer first so a single rim light can wrap the whole
 * silhouette - a shadow on every stroke of the body would glow the insides too.
 */
function hero(ctx, renderer, character, ballSkin, spec) {
  const { w, h } = spec;
  const s = spec.hero.s * h;
  const hx = spec.hero.x * w, hy = spec.hero.y * h;

  // The ball, in the body's own units. Once flipped to face left the raised
  // hand sits at about (-53,-139); the ball is on the palm at the moment of
  // the hit, at the game's own ball-to-body proportion (radius 24).
  const bx = -80, by = -170, r = 24;
  const inBodySpace = (fn) => {
    ctx.save();
    ctx.translate(hx, hy);
    ctx.scale(s, s);
    fn();
    ctx.restore();
  };

  // Flames first, so they sit behind the arm. Mostly straight up: that is open
  // sky in every layout, where aimed back along the arm they hid behind it.
  inBodySpace(() => flameTail(ctx, bx, by, r, 0.42, -0.91));

  const layer = document.createElement('canvas');
  layer.width = w; layer.height = h;
  const l = layer.getContext('2d');
  l.save();
  l.translate(hx, hy);
  l.scale(-s, s);                       // face left, towards the title
  renderer.drawVectorBody(l, character.palette || {}, character.images || {}, 0, SPIKE_POSE, character);
  l.restore();

  ctx.save();
  ctx.shadowColor = 'rgba(255,255,255,0.95)';
  ctx.shadowBlur = h * 0.02;
  ctx.drawImage(layer, 0, 0);
  ctx.shadowColor = 'rgba(4,10,24,0.45)';
  ctx.shadowBlur = h * 0.03;
  ctx.shadowOffsetY = h * 0.012;
  ctx.drawImage(layer, 0, 0);
  ctx.restore();

  inBodySpace(() => {
    impact(ctx, bx, by, r);
    renderer.drawBall(ctx, { x: bx, y: by, r, rot: 0.5, kind: 'fire', skin: ballSkin, trail: [] });
    sparks(ctx, bx, by, r);
  });
}

/** The hit itself: a broken white ring and a few speed strokes off the ball. */
function impact(ctx, x, y, r) {
  ctx.save();
  ctx.lineCap = 'round';
  ctx.strokeStyle = 'rgba(255,255,255,0.9)';
  ctx.lineWidth = 4;
  for (let i = 0; i < 3; i++) {
    const a = -0.5 + i * 2.1;
    ctx.beginPath();
    ctx.arc(x, y, r * 1.75, a, a + 1.25);
    ctx.stroke();
  }
  // Speed strokes pointing where the ball is going: down and to the left.
  ctx.lineWidth = 3.5;
  for (const [ox, oy, len] of [[-1.9, 0.9, 1.5], [-2.3, 0.2, 1.1], [-1.4, 1.6, 1.0]]) {
    ctx.beginPath();
    ctx.moveTo(x + ox * r, y + oy * r);
    ctx.lineTo(x + (ox - len * 0.8) * r, y + (oy + len * 0.55) * r);
    ctx.stroke();
  }
  ctx.restore();
}

/** Tapered flame tongues streaming back from the ball along (dx, dy). */
function flameTail(ctx, x, y, r, dx, dy) {
  const nx = -dy, ny = dx;              // perpendicular, for the tongue's width
  const tongues = [
    { len: 5.2, wid: 1.05, a: 0.82, bend: 0.0 },
    { len: 3.9, wid: 0.78, a: 0.90, bend: 0.9 },
    { len: 3.5, wid: 0.66, a: 0.90, bend: -1.0 }
  ];
  ctx.save();
  for (const t of tongues) {
    const L = r * t.len, W = r * t.wid;
    const tipX = x + dx * L + nx * r * t.bend, tipY = y + dy * L + ny * r * t.bend;
    const g = ctx.createLinearGradient(x, y, tipX, tipY);
    g.addColorStop(0, `rgba(255,248,196,${t.a})`);
    g.addColorStop(0.35, `rgba(255,170,40,${t.a * 0.9})`);
    g.addColorStop(1, 'rgba(230,60,10,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(x + nx * W, y + ny * W);
    ctx.quadraticCurveTo(x + dx * L * 0.5 + nx * W * 0.9, y + dy * L * 0.5 + ny * W * 0.9, tipX, tipY);
    ctx.quadraticCurveTo(x + dx * L * 0.5 - nx * W * 0.9, y + dy * L * 0.5 - ny * W * 0.9, x - nx * W, y - ny * W);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}

/** A spray of embers flung off the ball. Seeded, so every render matches. */
function sparks(ctx, x, y, r) {
  let seed = 7;
  const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  ctx.save();
  for (let i = 0; i < 14; i++) {
    const a = 0.3 + rnd() * 1.6;                 // up and behind the ball
    const d = r * (1.3 + rnd() * 2.2);
    const px = x + Math.cos(a) * d, py = y - Math.sin(a) * d;
    const pr = r * (0.05 + rnd() * 0.07);
    ctx.fillStyle = rnd() < 0.5 ? 'rgba(255,236,150,0.95)' : 'rgba(255,140,40,0.9)';
    ctx.beginPath(); ctx.arc(px, py, pr, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

/**
 * The wordmark: three stacked lines, extruded, outlined and gradient-filled,
 * on a slight tilt. Built on its own layer so one drop shadow sits under the
 * whole block rather than under every pass.
 */
function logo(ctx, spec) {
  const { w, h } = spec;
  const unit = w * spec.title.unit;
  const LINES = [
    { text: 'BEACH',  mul: 1.30, top: '#fff1cf', bot: '#efc27a' },
    { text: 'VOLLEY', mul: 2.10, top: '#fff07a', bot: '#ff9d14' },
    { text: 'CLASH',  mul: 1.62, top: '#9fe0ff', bot: '#2f7fe8' }
  ];

  // Leading comes from BOTH neighbours' sizes; stepping by one line's size let
  // a big line swallow the small one above it on the first covers.
  const ys = [0];
  for (let i = 1; i < LINES.length; i++) {
    ys.push(ys[i - 1] + (LINES[i - 1].mul + LINES[i].mul) * unit * 0.43);
  }
  const mid = ys[ys.length - 1] / 2;

  const layer = document.createElement('canvas');
  layer.width = w; layer.height = h;
  const l = layer.getContext('2d');
  l.translate(spec.title.x * w, spec.title.y * h);
  l.rotate(spec.title.rot);
  l.textAlign = 'center';
  l.textBaseline = 'middle';
  l.lineJoin = 'round';

  LINES.forEach((ln, i) => {
    const size = unit * ln.mul;
    const y = ys[i] - mid;
    const depth = Math.max(3, Math.round(size * 0.10));
    l.font = `900 ${size}px ${LOGO_FONT}`;

    // Extrusion: the outline stamped downwards, a pixel at a time.
    l.lineWidth = size * 0.2;
    for (let d = depth; d > 0; d--) {
      l.strokeStyle = d > depth * 0.4 ? LINE : '#122247';
      l.strokeText(ln.text, 0, y + d);
    }
    l.strokeStyle = LINE;
    l.strokeText(ln.text, 0, y);

    const g = l.createLinearGradient(0, y - size * 0.42, 0, y + size * 0.42);
    g.addColorStop(0, ln.top);
    g.addColorStop(0.52, ln.top);
    g.addColorStop(0.53, ln.bot);
    g.addColorStop(1, ln.bot);
    l.fillStyle = g;
    l.fillText(ln.text, 0, y);

    // A thin inner outline gives the fill a rim so it reads at thumbnail size.
    l.lineWidth = Math.max(1.5, size * 0.035);
    l.strokeStyle = 'rgba(255,255,255,0.55)';
    l.strokeText(ln.text, 0, y - size * 0.012);
  });

  ctx.save();
  ctx.shadowColor = 'rgba(4,10,24,0.55)';
  ctx.shadowBlur = unit * 0.35;
  ctx.shadowOffsetY = unit * 0.16;
  ctx.drawImage(layer, 0, 0);
  ctx.restore();
}

function vignette(ctx, w, h) {
  const g = ctx.createRadialGradient(w / 2, h * 0.45, Math.min(w, h) * 0.35, w / 2, h * 0.5, Math.hypot(w, h) * 0.62);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(4,12,30,0.42)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);
}

// --------------------------------------------------------------- main

async function main() {
  log('loading assets…');
  const assets = await loadAllAssets();
  attachPowerIcons(assets.powerIcons);

  // The empty beach - no match, so no players and no ball - at 3x, which is
  // enough to survive the crop on the tightest (portrait) cover.
  const SS = 3;
  const scene = document.createElement('canvas');
  scene.width = VIEW.W * SS;
  scene.height = VIEW.H * SS;
  const renderer = new Renderer(scene, assets);
  renderer.dpr = 1;
  renderer.rect = { x: 0, y: 0, w: scene.width, h: scene.height, scale: SS };
  renderer.time = 6.2;                       // a settled point in the wave/sun cycles
  renderer.draw(null, 0.016);
  renderer.draw(null, 0.016);                // second pass: cached sand layer is warm

  const kai = assets.characters.find((c) => c.id === 'kai') || assets.characters[0];

  for (const spec of SIZES) {
    const out = document.createElement('canvas');
    out.width = spec.w;
    out.height = spec.h;
    const ctx = out.getContext('2d');
    ctx.imageSmoothingQuality = 'high';

    backdrop(ctx, scene, spec);
    sunburst(ctx, spec);
    vignette(ctx, spec.w, spec.h);
    hero(ctx, renderer, kai, assets.balls[0], spec);
    logo(ctx, spec);

    const fig = document.createElement('figure');
    const prev = document.createElement('canvas');
    const k = 300 / spec.w;
    prev.width = Math.round(spec.w * k);
    prev.height = Math.round(spec.h * k);
    prev.getContext('2d').drawImage(out, 0, 0, prev.width, prev.height);
    const cap = document.createElement('figcaption');
    cap.textContent = `${spec.name} — ${spec.w}×${spec.h}`;
    fig.append(prev, cap);
    document.getElementById('out').append(fig);

    const blob = await new Promise((res) => out.toBlob(res, 'image/png'));
    const r = await fetch(`/__save?name=${encodeURIComponent(spec.name)}`, { method: 'POST', body: blob });
    log(`${r.ok ? 'saved' : 'FAILED'}  ${spec.name}  ${(blob.size / 1024).toFixed(0)} KB`, !r.ok);
  }

  log('done');
  window.__coversDone = true;
}

main().catch((e) => { log('ERROR ' + e.message, true); console.error(e); window.__coversError = e.message; });
</script>
</body>
</html>
