<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0f14" />
    <meta name="description" content="Dungeon.io — survive ten minutes in an endless dungeon while your spells cast themselves." />
    <title>Dungeon.io</title>
    <link rel="preload" as="fetch" href="./models/Idle.fbx" crossorigin />
    <link rel="preload" as="image" href="./models/diffuse.png" crossorigin />
    <!-- Portal builds: add the portal's SDK <script> here (CrazyGames / Poki). src/game/platform/Platform.js detects it. -->
  </head>
  <body>
    <canvas id="game-canvas"></canvas>
    <div id="touch-surface"></div>
    <div id="stick" aria-hidden="true"><div id="stick-knob"></div></div>

    <div id="loader" role="status">
      <div class="loader__logo">Dungeon.io</div>
      <div class="loader__track"><div id="loader-bar"></div></div>
      <div id="loader-text">Waking the dungeon…</div>
    </div>

    <div id="ui">
      <!-- In-run HUD -->
      <section id="hud" class="screen" aria-hidden="true">
        <div id="dmg-layer" aria-hidden="true"></div>
        <div id="player-hp" aria-hidden="true"><div id="player-hp-fill"></div></div>
        <div id="hurt" aria-hidden="true"></div>
        <div class="xp" aria-hidden="true"><div id="xp-fill"></div></div>
        <div class="hud-top">
          <div class="hud-left">
            <div class="level-badge">LV <span id="hud-level">1</span></div>
            <div class="loadout" id="loadout-spells" aria-label="Spells"></div>
            <div class="loadout" id="loadout-relics" aria-label="Relics"></div>
          </div>
          <div class="hud-center">
            <div id="hud-time" aria-live="off">0:00</div>
            <div id="boss">
              <div id="boss-name"></div>
              <div class="boss__track"><div id="boss-fill"></div></div>
            </div>
          </div>
          <div class="hud-right">
            <div class="kills" aria-label="Enemies slain">
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2C7 2 3 5.8 3 10.5c0 2.9 1.5 5.3 3.8 6.8V20a1 1 0 0 0 1 1h1.7v-2h1v2h3v-2h1v2h1.7a1 1 0 0 0 1-1v-2.7c2.3-1.5 3.8-3.9 3.8-6.8C21 5.8 17 2 12 2Zm-3.5 11a2 2 0 1 1 0-4 2 2 0 0 1 0 4Zm7 0a2 2 0 1 1 0-4 2 2 0 0 1 0 4Z"/></svg>
              <span id="hud-kills">0</span>
            </div>
            <button class="icon-btn" id="btn-pause" aria-label="Pause">
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
            </button>
          </div>
        </div>
        <div id="banner" aria-live="polite"></div>
      </section>

      <!-- Title -->
      <section id="screen-title" class="screen" aria-hidden="true">
        <div class="title">
          <h1 class="title__logo">Dungeon<span>.io</span></h1>
          <p class="title__tag">Survive ten minutes. Your spells cast themselves.</p>
          <button class="btn btn--primary" id="btn-play">Descend</button>
          <div class="title__best" id="title-best"></div>
          <div class="title__keys">
            <span><kbd>WASD</kbd>move</span>
            <span><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd>pick a card</span>
            <span><kbd>Esc</kbd>pause</span>
          </div>
          <button class="btn btn--ghost" id="btn-mute" aria-pressed="false">Sound: on</button>
        </div>
      </section>

      <!-- Level-up / treasure -->
      <section id="screen-choice" class="screen screen--dim" aria-hidden="true" aria-labelledby="choice-title">
        <div class="choice">
          <h2 id="choice-title">Level up!</h2>
          <p id="choice-sub"></p>
          <div id="choice-cards"></div>
        </div>
      </section>

      <!-- Pause -->
      <section id="screen-pause" class="screen screen--dim" aria-hidden="true">
        <div class="panel">
          <h2>Paused</h2>
          <div class="panel__label">Your build</div>
          <div id="pause-loadout"></div>
          <div class="panel__row">
            <button class="btn btn--primary" id="btn-resume">Resume</button>
            <button class="btn" id="btn-quit">Abandon run</button>
          </div>
        </div>
      </section>

      <!-- Run over -->
      <section id="screen-end" class="screen screen--dim" aria-hidden="true">
        <div class="panel">
          <h2 id="end-title">Claimed by the Dark</h2>
          <dl id="end-stats"></dl>
          <div class="panel__label">Damage by spell</div>
          <ul class="rows" id="end-damage"></ul>
          <div class="panel__row">
            <button class="btn btn--primary" id="btn-revive" hidden>Revive</button>
            <button class="btn btn--primary" id="btn-again">Descend again</button>
            <button class="btn" id="btn-menu">Title</button>
          </div>
        </div>
      </section>
    </div>

    <script type="module" src="./src/game/main.js"></script>
  </body>
</html>
